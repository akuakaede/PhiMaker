<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Project - PhiMaker</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="stylesheet" type="text/css" href="scrollbar.css">
</head>

<body>
    <!-- 页面标题 -->
    <h2>新建铺面</h2>

    <!-- 表单外壳（用于布局） -->
    <div class="create">
        <!-- 新建项目表单：用户在此填写铺面信息 -->
        <form id="create-project-form">
            <!-- 链接到项目名输入框 -->
            <label for="project-name">铺面名称:</label>
            <input type="text" id="project-name" name="project-name" required placeholder="例如：咕咕嘎嘎" aria-label="铺面名称">

            <!-- 难度：显示为数字输入框 + 滑条（互相同步） -->
            <label for="project-difficulty-number">难度 (数值):</label>
            <div class="number-range-row">
                <!-- 数字框（可直接输入精确数值） -->
                    <input type="number" step="0.1" id="project-difficulty-number" name="project-difficulty" min="0"
                        max="30" value="8" required title="请输入铺面难度（数字，0-30）" placeholder="0-30" aria-label="铺面难度数字">
                <!-- 滑条：用于快速调整难度 -->
                <input type="range" step="0.1" id="project-difficulty-range" min="0" max="30" value="8"
                    aria-label="铺面难度滑条">
            </div>

            <!-- 难度等级（文本） -->
            <label for="project-diffculty-level">难度等级:</label>
            <input type="text" id="project-difficulty-level" name="project-difficulty-level" required title="铺面难度"
                placeholder="就是铺子右下角那个" aria-label="铺面难度等级">

            <!-- 作者信息（文本输入） -->
            <label for="project-author">作者:</label>
            <input type="text" id="project-author" value="UK" title="默认为 'UK'" name="project-author"
                placeholder="作者名, 默认为 'UK'" required aria-label="作者">

            <!-- 音乐作者 -->
            <label for="project-music-author">音乐作者:</label>
            <input type="text" id="project-music-author" value="UK" title="默认为 'UK'" name="project-music-author"
                placeholder="音乐作者, 默认为 'UK'" required aria-label="音乐作者">

            <!-- 插图作者 -->
            <label for="project-picture-author">插图作者:</label>
            <input type="text" id="project-picture-author" value="UK" title="默认为 'UK'" name="project-picture-author"
                placeholder="插图作者, 默认为 'UK'" aria-label="插图作者" required>

            <!-- tip 文本 -->
            <label for="project-tip">Tip:</label>
            <input type="text" id="project-tip" value='' placeholder="可选；留空时 Phira 会自动提供提示" name="project-tip"
                aria-label="提示">

            <!-- 提交按钮：右对齐（由 CSS 控制） -->
            <button type="submit" id="create-submit">Create Project</button>
        </form>

        <!-- 右侧上传面板 -->
        <aside class="side-panel" aria-label="上传素材">
            <div class="file-input-row">
                <div class="music-input">
                    <label for="map-music">音乐文件（必填）</label>
                    <input id="map-music" name="music" type="file" accept="audio/*" required form="create-project-form">
                    <div class="file-meta"><span id="map-music-name" class="file-name">选择音乐文件</span></div>
                    <div id="map-music-preview" class="file-preview" aria-hidden="true"></div>
                </div>
                <div class="image-input">
                    <label for="map-image">铺面插图（必填）</label>
                    <input id="map-image" name="illustration" type="file" accept="image/*" required form="create-project-form">
                    <div class="file-meta"><span id="map-image-name" class="file-name">选择图片文件</span></div>
                    <div id="map-image-preview" class="file-preview" aria-hidden="true"></div>
                </div>
            </div>
            <div class="file-input-row">
                <div class="chart-input">
                    <label for="map-chart">谱图文件（必填）</label>
                    <input id="map-chart" name="chart" type="file" accept=".json,.pec,.pgr,.pbc" required form="create-project-form">
                    <div class="file-meta"><span id="map-chart-name" class="file-name">选择谱图文件</span></div>
                </div>
                <div class="video-input">
                    <label for="map-unlock-video">解锁视频（可选）</label>
                    <input id="map-unlock-video" name="unlockVideo" type="file" accept="video/*" form="create-project-form">
                    <div class="file-meta"><span id="map-unlock-video-name" class="file-name">未选择视频</span></div>
                </div>
            </div>
            <p>支持 Phira 可识别的谱图文件；格式由内容推断。</p>
        </aside>
    </div>
    <p id="create-status" role="status" aria-live="polite"></p>

    <!-- 页面脚本：同步滑条与数字，并处理表单提交 -->
    <script>
        // 将原始 File 对象传给父页面，避免把大文件编码成体积更大的 data URL。
        document.getElementById('create-project-form').addEventListener('submit', function (event) {
            event.preventDefault();
            const formEl = document.getElementById('create-project-form');
            if (!formEl.checkValidity()) {
                formEl.reportValidity();
                return;
            }

            const getVal = id => document.getElementById(id).value.trim();
            const payload = {
                name: getVal('project-name'),
                difficulty: Number(getVal('project-difficulty-number')),
                difficultyLevel: getVal('project-difficulty-level'),
                author: getVal('project-author'),
                musicAuthor: getVal('project-music-author'),
                pictureAuthor: getVal('project-picture-author'),
                tip: getVal('project-tip'),
                files: {
                    music: document.getElementById('map-music').files[0],
                    image: document.getElementById('map-image').files[0],
                    chart: document.getElementById('map-chart').files[0],
                    unlockVideo: document.getElementById('map-unlock-video').files[0] || null
                }
            };

            if (window.parent === window) {
                document.getElementById('create-status').textContent = '无法连接主页面，请从 PhiMaker 中打开新建窗口。';
                return;
            }

            document.getElementById('create-status').textContent = '正在将铺面写入本地缓存…';
            document.getElementById('create-submit').disabled = true;
            window.parent.postMessage({ type: 'create-project', payload }, window.location.origin);
        });

        window.addEventListener('message', function (event) {
            if (event.origin !== window.location.origin || event.source !== window.parent || !event.data) return;
            const status = document.getElementById('create-status');
            if (event.data.type === 'create-project-saved') {
                status.textContent = '铺面已保存到本机缓存。';
            } else if (event.data.type === 'create-project-error') {
                status.textContent = '保存失败：' + event.data.message;
                document.getElementById('create-submit').disabled = false;
            }
        });

        // 同步逻辑：数字输入与滑条互相同步（支持浮点 step）
        (function () {
            const numInput = document.getElementById('project-difficulty-number');
            const rangeInput = document.getElementById('project-difficulty-range');
            if (!numInput || !rangeInput) return;

            // helper: clamp
            function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

            // 滑条变化 -> 更新数字框
            rangeInput.addEventListener('input', function (e) {
                // 保持小数位（依据 step）
                const step = parseFloat(rangeInput.step) || 1;
                const v = parseFloat(e.target.value);
                numInput.value = (Math.round(v / step) * step).toFixed((step.toString().split('.')[1] || '').length);
            });

            // 数字框变化 -> 更新滑条（并约束在范围内）
            numInput.addEventListener('input', function (e) {
                let v = parseFloat(e.target.value);
                if (isNaN(v)) v = 0;
                const min = parseFloat(rangeInput.min) || 0;
                const max = parseFloat(rangeInput.max) || 50;
                const step = parseFloat(rangeInput.step) || 1;
                v = clamp(v, min, max);
                // 规范小数位
                const decimals = (step.toString().split('.')[1] || '').length;
                rangeInput.value = v;
                e.target.value = v.toFixed(decimals);
            });
        })();

        // 显示已选文件名与大小
        (function () {
            function niceSize(bytes) {
                if (!bytes && bytes !== 0) return '';
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
                return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
            }

            function attachFilePreview(inputId, nameId, placeholder, previewId) {
                const inp = document.getElementById(inputId);
                const label = document.getElementById(nameId);
                const preview = document.getElementById(previewId);
                if (!inp || !label) return;
                // 初始化占位文本
                if (!label.textContent || label.textContent.trim() === '') label.textContent = placeholder || '';

                // 找到同级的清除按钮（如果存在）
                const clearBtn = label.parentElement ? label.parentElement.querySelector('.clear-btn') : null;

                function clearSelection() {
                    // 清除 input
                    try { inp.value = ''; } catch (e) { /* ignore */ }
                    // 恢复占位文本
                    if (label) { label.textContent = placeholder || '未选择文件'; label.title = ''; }
                    // 清除预览并撤销 objectURL
                    if (preview) {
                        if (preview._objURL) {
                            URL.revokeObjectURL(preview._objURL);
                            preview._objURL = null;
                        }
                        preview.innerHTML = '';
                        preview.setAttribute('aria-hidden', 'true');
                    }
                }

                if (clearBtn) {
                    clearBtn.addEventListener('click', function () {
                        clearSelection();
                    });
                }

                inp.addEventListener('change', function () {
                    if (inp.files && inp.files.length > 0) {
                        const f = inp.files[0];
                        label.textContent = f.name + ' (' + niceSize(f.size) + ')';
                        label.title = f.name;

                        // 生成预览
                        if (preview) {
                            // 清理旧预览
                            if (preview._objURL) { URL.revokeObjectURL(preview._objURL); preview._objURL = null; }
                            preview.innerHTML = '';
                            // 图片缩略
                            if (f.type && f.type.startsWith('image/')) {
                                const img = document.createElement('img');
                                img.className = 'file-thumb';
                                const obj = URL.createObjectURL(f);
                                preview._objURL = obj;
                                img.src = obj;
                                img.alt = f.name;
                                preview.appendChild(img);
                                preview.setAttribute('aria-hidden', 'false');
                            } else if (f.type && f.type.startsWith('audio/')) {
                                const audio = document.createElement('audio');
                                audio.className = 'audio-preview';
                                audio.controls = true;
                                const obj = URL.createObjectURL(f);
                                preview._objURL = obj;
                                audio.src = obj;
                                preview.appendChild(audio);
                                preview.setAttribute('aria-hidden', 'false');
                            } else {
                                preview.setAttribute('aria-hidden', 'true');
                            }
                        }
                    } else {
                        // 无文件，恢复占位
                        if (label) { label.textContent = placeholder || '未选择文件'; label.title = ''; }
                        if (preview) { if (preview._objURL) { URL.revokeObjectURL(preview._objURL); preview._objURL = null; } preview.innerHTML = ''; preview.setAttribute('aria-hidden', 'true'); }
                    }
                });
            }

            attachFilePreview('map-music', 'map-music-name', '选择音乐文件', 'map-music-preview');
            attachFilePreview('map-image', 'map-image-name', '选择图片文件', 'map-image-preview');

            ['map-chart', 'map-unlock-video'].forEach(function (inputId) {
                const input = document.getElementById(inputId);
                const label = document.getElementById(inputId + '-name');
                input.addEventListener('change', function () {
                    label.textContent = input.files.length ? input.files[0].name : (inputId === 'map-chart' ? '选择谱图文件' : '未选择视频');
                    label.title = input.files.length ? input.files[0].name : '';
                });
            });
        })();
    </script>
</body>

</html>
